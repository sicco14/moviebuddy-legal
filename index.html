<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Legal — Watchy</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg: #0f0f0f;
      --surface: #181818;
      --border: #2a2a2a;
      --accent: #e8c97a;
      --text: #e8e8e8;
      --muted: #888;
      --radius: 12px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      line-height: 1.75;
      padding: 48px 24px 80px;
    }
    .container {
      max-width: 720px;
      margin: 0 auto;
    }
    header {
      margin-bottom: 48px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 32px;
    }
    .app-name {
      font-family: 'DM Serif Display', serif;
      font-size: 13px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 12px;
    }
    h1 {
      font-family: 'DM Serif Display', serif;
      font-size: clamp(32px, 6vw, 48px);
      font-weight: 400;
      line-height: 1.15;
      color: #fff;
    }
    .links {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    a.card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px 28px;
      text-decoration: none;
      transition: border-color 0.15s;
    }
    a.card:hover {
      border-color: var(--accent);
    }
    .card-title {
      font-family: 'DM Serif Display', serif;
      font-size: 20px;
      font-weight: 400;
      color: #fff;
    }
    .card-desc {
      font-size: 13px;
      color: var(--muted);
      margin-top: 4px;
    }
    .arrow {
      color: var(--accent);
      font-size: 20px;
      flex-shrink: 0;
      margin-left: 16px;
    }
    footer {
      margin-top: 64px;
      padding-top: 32px;
      border-top: 1px solid var(--border);
      font-size: 13px;
      color: var(--muted);
      text-align: center;
    }
  </style>
</head>
<body>
<div class="container">
  <header>
    <div class="app-name">Watchy</div>
    <h1>Legal</h1>
  </header>

  <div class="links">
    <a class="card" href="privacy-policy.html">
      <div>
        <div class="card-title">Privacy Policy</div>
        <div class="card-desc">How we collect, use, and protect your data</div>
      </div>
      <div class="arrow">→</div>
    </a>
    <a class="card" href="terms.html">
      <div>
        <div class="card-title">Terms of Service</div>
        <div class="card-desc">Rules and conditions for using Watchy</div>
      </div>
      <div class="arrow">→</div>
    </a>
    <a class="card" href="delete-account.html">
      <div>
        <div class="card-title">Delete Account</div>
        <div class="card-desc">Request permanent deletion of your account and data</div>
      </div>
      <div class="arrow">→</div>
    </a>
  </div>

  <footer>
    &copy; 2026 Watchy · <a href="mailto:info@watchy.ac" style="color: var(--accent); text-decoration: none;">info@watchy.ac</a>
  </footer>
</div>
</body>
</html>
